repos:
  - repo: local
    hooks:
      - id: validate-schemas
        name: Validate JSON schemas
        language: node
        entry: node tests/validate-schemas.js
        pass_filenames: false
        types: [json]

      - id: lint-specs
        name: Lint SOT spec files
        language: node
        entry: node tests/lint-specs.js
        pass_filenames: false
        types: [markdown]

      - id: project-map-fresh
        name: Project map up to date (regenerate with scripts/build_map.py)
        language: system
        entry: sh -c 'python scripts/build_map.py && python scripts/build_map.py --check'
        pass_filenames: false
        types: [markdown]

# gate-check.js retirado do pre-commit (DHR-COESAO-002): lê o payload de hook do Claude Code (stdin) e rodava como no-op.
# Continua como hook de sessão (.claude/settings.json); schemas, specs e mapa seguem validados aqui e no CI.

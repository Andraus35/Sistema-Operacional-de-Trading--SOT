name: SOT Harness CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate SOT Harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON schemas
        run: npm test

      - name: Lint spec files
        run: npm run lint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # BLOQUEANTE: gate determinístico de estrutura das Specs (ENF-03: Detector ≠ Gate).
      # Roda validate_spec_sot.py em TODO specs/features/*/plan.md (Specs novas entram sozinhas).
      # exit 1 = NÃO CONFORME Crítica de estrutura; não substitui Revisor nem homologação.
      - name: Validate Spec structure (validate_spec_sot.py)
        run: |
          fail=0
          for f in specs/features/*/plan.md; do
            echo "::group::$f"
            python scripts/validate_spec_sot.py "$f" || { echo "::error file=$f::validate_spec_sot.py reprovou a estrutura"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

      # Informativo (não bloqueia): integridade de referências cruzadas.
      # Promover a bloqueante só no nível ERRO após período estável — nunca --strict/--info.
      - name: Check cross-references (informative)
        run: python scripts/check_refs.py
        continue-on-error: true

      # Informativo (não bloqueia): BL-006 — imprime itens ATIVADOS / gatilhos disparados do RMR-001.
      - name: Backlog triggers (informative)
        run: python scripts/backlog_triggers.py
        continue-on-error: true

      # Informativo (não bloqueia): sincronização documental — decisão CONS-01 desatualizada
      # em registro oficial, RULE citada como normativa sem seção em RULES.md, Estado de
      # backlog fora do enum do RMR-001 §2, intake dessincronizado do painel vivo.
      # Promover a bloqueante só no nível ERRO após período estável — nunca --strict.
      - name: Check documentation sync (informative)
        run: python scripts/check_doc_sync.py
        continue-on-error: true

      # Informativo (não bloqueia): PCC-001 Fase 2 — integridade/defasagem do HANDOFF.md
      # (frontmatter, cadeia, base_commit, staleness, segredo, decisão aberta como fechada).
      # Detector ≠ Gate (ENF-03). Promoção a bloqueante só por decisão de Andraus (D-PCC-4).
      - name: Check handoff (informative)
        run: |
          git fetch --unshallow --quiet || true
          python scripts/check_handoff.py
        continue-on-error: true

      # Informativo (não bloqueia): DHR-AUDITOR-EXTERNO-008 R2 — VALORES e ORDEM das regras fixas em plan.md
      # (R:R, score/convicção de Fase Piloto, 8 dimensões, hierarquia, 7 estados, 4Es, validade do Dossiê).
      # Detector ≠ Gate (ENF-03): quem julga é o Revisor; quem decide é Andraus.
      - name: Check invariant values (informative)
        run: python scripts/check_invariants.py
        continue-on-error: true

      # Testes do detector de valores (bloqueante: se falhar, a ferramenta está quebrada ou o AGENTS.md mudou).
      - name: Invariant checker tests
        run: python -m unittest tests/test_check_invariants.py

      # Testes do runner de evidências de gates (R1/DHR-008): o Revisor recebe o evidence.json, não executa nada.
      - name: Gate evidence runner tests
        run: python -m unittest tests/test_run_gates.py

      # Gate fundido do Revisor (DHR-AUDITOR-EXTERNO-009 F1): testes bloqueantes + calibração (Specs vigentes sem falso alarme).
      - name: Fused Revisor gate tests
        run: python -m unittest tests/test_revisor_gate.py

      # Ferramenta estreita do Revisor (DHR-009 F2): testes de RECUSA são bloqueantes (a segurança está no servidor).
      - name: Revisor gate MCP tool tests
        run: python -m unittest tests/test_revisor_gate_mcp.py

      # Selo de integridade do gate (DHR-AUDITOR-EXTERNO-015): script do gate alterado sem regravar o manifesto reprova (bloqueante).
      - name: Gate integrity manifest
        run: python scripts/gate_manifest.py --check

      - name: Gate manifest and read-only subagent tests
        run: python -m unittest tests/test_gate_manifest.py

      # Detectores D adicionais do gate (DHR-AUDITOR-EXTERNO-017): calibração nos Plans homologados + mutação; guarda do fim do Revisor.
      - name: Revisor detectors and guard tests
        run: python -m unittest tests/test_revisor_detectores.py tests/test_revisor_guard.py tests/test_revisor_posguarda.py tests/test_roteador_modelos.py

      # Testes da ferramenta de carimbos (bloqueante: se falhar, a ferramenta está quebrada).
      - name: RPSA tool tests
        run: python -m unittest tests/test_rpsa.py

      # Testes do roteador de achados do Auditor Externo (DHR-AUDITOR-EXTERNO-005; bloqueante: roteador quebrado = faixa rápida insegura).
      - name: AEX router tests
        run: python -m unittest tests/test_route_aex.py

      # Testes do registro automático da classificação RPSA (DHR-RPSA-002; bloqueante).
      - name: RPSA auto tests
        run: python -m unittest tests/test_rpsa_auto.py

      # Informativo (não bloqueia): carimbo `sincronizado-até` dos agentes vs livro-razão (RPSA, EUA-E16; DHR-RPSA-001).
      # Divergência = DHR nova sem classificação, Agent-Sync pendente ou carimbo defasado. Promover a bloqueante só por decisão de Andraus.
      - name: RPSA agent stamps (informative)
        run: python scripts/check_rpsa.py
        continue-on-error: true

      # BLOQUEANTE: RULE-ECC-06 (DHR-ECC06-001) — pesquisa em repositórios seguros e bem avaliados.
      # Specs novas (a partir de SPEC-004) sem a seção/capturas/régua cumpridas reprovam aqui.
      - name: Repo research rule (RULE-ECC-06)
        run: |
          python -m unittest tests/test_repo_research.py
          python scripts/check_repo_research.py --all

      # BLOQUEANTE: o mapa do projeto (BL-019) deve refletir os documentos. Corrigir com:
      #   python scripts/build_map.py   (os hooks .claude/settings.json já fazem isso localmente)
      - name: Project map up to date
        run: |
          python scripts/build_map.py --check || {
            echo "::error title=Mapa do projeto desatualizado::Rode 'python scripts/build_map.py' e inclua docs/mapa/ no commit (hooks do Claude Code fazem isso localmente)."
            exit 1
          }

      # Testes que existiam e não rodavam no CI (auditoria de coesão 2026-10-17, achado O2): detectores de mapa/sync/handoff/refs/backlog
      # e as 4 suítes de hook em Node que sustentam as regras de Andraus. Sem 'continue-on-error': regressão aqui é falha real.
      - name: Detector tests and hook tests (previously not in CI)
        run: |
          git fetch --unshallow --quiet || true
          python -m unittest tests/test_build_map.py tests/test_check_doc_sync.py tests/test_check_handoff.py tests/test_check_refs.py tests/test_backlog_triggers.py tests/test_struct10.py
          npm run test:hooks

      - name: Check required files present
        run: |
          required_files=(
            "governance/CONSTITUTION.md" "governance/RULES.md" "governance/CONFLICT-MAP.md" "AGENTS.md"
            "specs/elliott-wave.spec.md" "specs/fibonacci.spec.md"
            "specs/smc.spec.md" "specs/ict.spec.md" "specs/synthesis.spec.md"
            "schemas/elliott-wave.input.json" "schemas/elliott-wave.output.json"
            "schemas/fibonacci.input.json" "schemas/fibonacci.output.json"
            "schemas/smc.input.json" "schemas/smc.output.json"
            "schemas/ict.input.json" "schemas/ict.output.json"
            "schemas/synthesis.input.json" "schemas/synthesis.output.json"
            "rag/elliott-wave.knowledge.md" "rag/fibonacci.knowledge.md"
            "rag/smc.knowledge.md" "rag/ict.knowledge.md"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; missing=$((missing+1)); fi
          done
          if [ $missing -gt 0 ]; then echo "ERROR: $missing required files missing"; exit 1; fi
          echo "All required harness files present"

      - name: Run harness score
        run: npx harness-score
        continue-on-error: true
